name: Bug report / 问题反馈
description: 用虚构材料提供可复现步骤，不上传私人知识库
body:
  - type: markdown
    attributes:
      value: 请删除账户信息、真实用户名目录、客户资料、密钥、完整运行回执与私人笔记。安全问题见 SECURITY.md。
  - type: textarea
    id: environment
    attributes:
      label: 系统与工具版本
      placeholder: Windows / Python / PowerShell / Obsidian versions, without personal paths
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 使用虚构数据的复现步骤
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期、实际结果和最小脱敏错误
    validations:
      required: true
